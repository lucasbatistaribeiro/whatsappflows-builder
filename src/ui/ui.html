<style>
  * { box-sizing: border-box; }

  /* ========================================================================
     TWO BRANDS, TWO NAMESPACES. Every colour in this file belongs to exactly
     one of them, and the prefix says which — so you never have to guess at a
     use site which identity you are about to change.

       --ui-*   THE PLUGIN's own chrome. Derived from --figma-color-* so the
                panel sits inside Figma's light/dark theme. Text here has a
                14px minimum.
       --wa-*   WHATSAPP's identity, for the phone mockup only. Set from
                src/main/theme.ts by applyThemeVars() — the same tokens the
                Figma generator paints with, which is what keeps the live
                preview and the generated frames in step. Measured off
                WhatsApp's own surfaces; real WhatsApp sizes, often < 14px.

     Never point one at the other. A --wa-* value is WhatsApp's to dictate and
     ours to copy accurately; a --ui-* value is ours to choose. The --ui-*
     values live in src/ui/tokens.css (mirrored from the Figma variables) and
     are inlined at the marker below by build/esbuild.mjs.
     ======================================================================== */
  /*__UI_TOKENS__*/
  :root { color-scheme: light dark; /* let native popups/scrollbars follow the theme */ }

  body {
    margin: 0;
    font: 14px/1.45 var(--md-ref-typeface-plain);
    color: var(--md-sys-color-on-surface);
    background: var(--md-sys-color-surface);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  /* The rail is built into a host div; `contents` lets the rail itself be the
     flex child, so it stretches to the panel's height. */
  #rail-host { display: contents; }
  .ic { display: inline-flex; align-items: center; }
  svg.lucide { display: block; }

  /* ########################################################################
     PLUGIN CHROME — the rail + panel UI. Its components are the .ui-* rules
     inlined above (src/ui/chrome.css); what follows is the glue that only this
     page needs: the import offer, the generating state, the property editor
     and the dropdown. --ui-* tokens, 14px minimum text.
     ######################################################################## */

  /* Import offer banner (clicking a generated section in Figma). Animated open:
     `display` can't transition, so it stays flex and collapses via max-height /
     opacity / padding, with visibility keeping it out of the tab order when shut. */
  #offer { display: flex; align-items: center; gap: var(--ui-space-10);
    padding: 0 var(--ui-space-16); max-height: 0; opacity: 0; visibility: hidden; overflow: hidden;
    background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-bottom: 1px solid transparent; flex: none;
    transition: max-height .22s ease, opacity .18s ease, padding .22s ease,
                border-bottom-color .22s ease, visibility .22s; }
  #offer.open { max-height: 200px; opacity: 1; visibility: visible;
    padding: var(--ui-space-12) var(--ui-space-16); border-bottom-color: var(--md-sys-color-outline-variant); }
  .offer-text { flex: 1; min-width: 0; }
  .offer-title { font-size: var(--md-sys-typescale-emphasized-label-medium-size); font-weight: var(--md-sys-typescale-emphasized-label-medium-weight); }
  .offer-body { font-size: var(--md-sys-typescale-body-small-size); opacity: .8; margin-top: 1px; }
  .offer-actions { display: flex; gap: var(--ui-space-8); flex: none; }

  /* Generating: an indeterminate bar under the toolbar + a skeletoned body.
     The bar runs for as long as the main thread takes; the lists keep their
     footprint and shimmer, while the toolbar stays live so the Generate
     button's own spinner remains visible. */
  #gen-bar { display: none; flex: none; height: 3px; background: var(--md-sys-color-primary-container); overflow: hidden; }
  body.generating #gen-bar { display: block; }
  #gen-bar span { display: block; height: 100%; width: 40%; border-radius: 3px;
    background: var(--md-sys-color-primary); animation: gen-bar 1.1s ease-in-out infinite; }
  @keyframes gen-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #generate.busy:disabled { opacity: .85; cursor: progress; }
  #generate.busy svg { animation: gen-spin .9s linear infinite; }
  #generate.done { animation: gen-pop .34s ease; }
  #generate.done svg { animation: gen-check .34s ease; }
  @keyframes gen-spin { to { transform: rotate(360deg); } }
  @keyframes gen-pop { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.07); } }
  @keyframes gen-check { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  body.generating .ui-card, body.generating .ui-row, body.generating .ui-banner, body.generating .ui-section-head,
  body.generating .ui-field, body.generating .ui-search, body.generating .ui-code, body.generating .wa-phone, body.generating .pv-tabs {
    color: transparent !important; border-color: transparent !important; box-shadow: none !important;
    background-color: var(--md-sys-color-surface-container-low);
    background-image: linear-gradient(90deg, var(--md-sys-color-surface-container-low) 25%, var(--md-sys-color-outline-variant) 37%, var(--md-sys-color-surface-container-low) 63%);
    background-size: 400% 100%; animation: skel 1.2s ease-in-out infinite;
    border-radius: var(--ui-radius-md); pointer-events: none; }
  body.generating .ui-card > *, body.generating .ui-row > *, body.generating .ui-banner > *, body.generating .ui-section-head > *,
  body.generating .ui-field > *, body.generating .ui-search > *, body.generating .wa-phone > *, body.generating .pv-tabs > * { visibility: hidden; }
  @keyframes skel { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* The preview's screen switcher (preview.ts draws it). Plugin chrome, not
     part of the mockup: the plugin accent, so the WhatsApp theme can't recolour
     the builder's own controls. Styled as the chips of the new chrome. */
  .pv-tabs { display: flex; gap: var(--ui-space-8); flex-wrap: wrap; justify-content: center; margin-bottom: var(--ui-space-16); }
  .pv-tab { height: calc(38px * var(--ui-scale)); padding: 0 var(--ui-space-16); border-radius: var(--ui-radius-xl); font-family: inherit;
    font-size: var(--md-sys-typescale-label-medium-size); background: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline-variant); color: var(--md-sys-color-on-surface-variant); cursor: pointer; }
  .pv-tab.active { background: var(--md-sys-color-primary); border-color: transparent; color: var(--md-sys-color-on-primary); font-weight: var(--md-sys-typescale-emphasized-label-medium-weight); }
  .pv-tab.err { box-shadow: inset 0 0 0 1.5px var(--md-sys-color-error); }

  /* Composer internals that sit inside a message card (chatComposer.ts). */
  .chat-row { display: flex; align-items: flex-end; gap: var(--ui-space-8); }
  .chat-row > .ui-field, .chat-row > .chat-stack { flex: 1; min-width: 0; }
  .chat-stack { display: flex; flex-direction: column; gap: var(--ui-space-4); min-width: 0; }
  .chat-sub { padding: var(--ui-space-12); border-radius: var(--ui-radius-md);
    background: var(--md-sys-color-surface-container-low); display: flex; flex-direction: column; gap: var(--ui-space-10); }
  .chat-sub .ui-input, .chat-sub textarea { background: var(--md-sys-color-surface); }

  /* ########################################################################
     WHATSAPP MOCKUP — begins here and runs to the "back to plugin chrome"
     marker below. Everything in between imitates WhatsApp: real sizes, real
     colours, --wa-* tokens only, no exceptions. DO NOT restyle it to match
     the plugin, and never reach for a --ui-* token in here.
     ######################################################################## */

  /* ---- Live WhatsApp preview (fixed WhatsApp UI — do not restyle) ---- */
  /* The chat the flow sheet opens over. `classic` is the pre-2021 green bar,
     measured off Meta's Flows artwork; `current` follows the mockup theme. */
  /* A 42px photo in 8px of vertical padding -> 58px tall. Right padding 12,
     everything else 8. The colours are the UNDIMMED ones; `.scrimmed` lays the
     raised sheet's overlay on top, exactly as the generator does. */
  .wa-chat-head { position: relative; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 8px; flex: none; }
  .wa-chat-head.current { background: var(--wa-chat-header, #fff); color: var(--wa-text); }
  .wa-chat-head.classic { background: #008069; color: #fff; }
  .wa-chat-head.classic .wa-chat-badge { color: #00c853; }
  .wa-chat-head.current .wa-chat-badge { color: var(--wa-link); }
  /* Black at a third, measured — see SHEET_SCRIM in src/main/theme.ts. It sits
     over the contact's photo too, which is why it is an overlay and not a
     darker token. */
  .wa-chat-head.scrimmed::after { content: ""; position: absolute; inset: 0;
    background: rgba(0, 0, 0, .3333); pointer-events: none; }
  .wa-chat-head .wa-hicon svg { width: 20px; height: 20px; }
  .wa-chat-av { width: 42px; height: 42px; border-radius: 50%; flex: none; object-fit: cover;
    background: var(--wa-chip, #f0f2f5); }
  .wa-chat-av.mono { display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: var(--wa-text2); }
  .wa-chat-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px;
    font-size: 16px; font-weight: 600; }
  .wa-chat-name > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wa-chat-badge { display: inline-flex; flex: none; }
  /* The flow itself: a bottom sheet, so it rounds at the top and clips. */
  .wa-sheet { flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--wa-bg, #fff); border-radius: 16px 16px 0 0; overflow: hidden; }
  /* Android's navigation bar: 41px at a 360-wide screen, measured off Meta's
     artwork. It is what keeps the CTA off the bottom edge. */
  .wa-nav { height: 41px; flex: none; display: flex; align-items: center;
    justify-content: space-between; padding: 0 48px; background: var(--wa-nav, #f6f8fa); }
  .wa-nav span { width: 13px; height: 13px; background: var(--wa-text); flex: none; }
  .wa-nav .nav-back { clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .wa-nav .nav-home { border-radius: 50%; background: none;
    box-shadow: inset 0 0 0 1.5px var(--wa-text); }
  .wa-nav .nav-recents { border-radius: 1px; }

  /* The phone is laid out at the mockup's true width — DEVICE.width, 360 —
     so a 40px CTA here is the same 40px the generator draws. `zoom` (set from
     renderPreview) shrinks the whole thing to fit the panel, scaling layout
     with it. Sizing the box to 300px instead, as this did, left the contents
     at 360 and made everything inside read ~20% oversized against the phone. */
  .wa-phone {
    width: 360px; margin: 0 auto; border-radius: 28px; overflow: hidden;
    border: 9px solid #0b0b0b; background: var(--wa-bg, #fff);
    display: flex; flex-direction: column; aspect-ratio: 9 / 19; height: auto; flex: none;
    box-shadow: 0 6px 24px rgba(0,0,0,.18); color: var(--wa-text, #111);
  }
  .wa-phone.has-error { border-color: #d33; }

  /* ---- Chat mode (knowledge/CHAT_UI.md) -------------------------------------
     Real WhatsApp sizes/colours, like the rest of wa-*: the 14px plugin-chrome
     minimum does NOT apply here. Every colour comes from a --wa-* var so the
     light/dark toggle drives this for free. Values are unconfirmed until
     calibrated against a real screenshot. */
  .wa-c-phone { background: var(--wa-wallpaper, #efeae2); }
  .wa-c-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--wa-chat-header, #f0f2f5); color: var(--wa-text); flex: none; }
  .wa-c-header svg { flex: none; color: var(--wa-text2); }
  .wa-c-avatar { width: 30px; height: 30px; border-radius: 50%; flex: none;
    object-fit: cover; background: var(--wa-chip); }
  .wa-c-monogram { display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--wa-text2); }
  .wa-c-names { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .wa-c-name { font-size: 14px; font-weight: 600; line-height: 1.25;
    display: flex; align-items: center; gap: 3px; min-width: 0; }
  .wa-c-name > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wa-c-name svg { flex: none; color: var(--wa-link); }
  .wa-c-presence { font-size: 11px; color: var(--wa-text2); line-height: 1.2; }
  .wa-c-actions { display: flex; align-items: center; gap: 12px; flex: none; }

  /* Messages sit at the BOTTOM of the thread, like the real app: a short
     conversation leaves the empty wallpaper above it, not below. `margin-top:auto`
     on the first child does this without breaking scrolling, which
     justify-content:flex-end would (it clips overflow at the top). */
  .wa-c-thread { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 7px;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--wa-wallpaper, #efeae2); }
  .wa-c-thread > :first-child { margin-top: auto; }
  .wa-c-pill-row { display: flex; justify-content: center; }
  .wa-c-pill { font-size: 11px; padding: 5px 9px; border-radius: 7px;
    color: var(--wa-text2); box-shadow: 0 1px 0 rgba(0,0,0,.05);
    max-width: 85%; text-align: center; }
  /* Only the encryption notice is the yellow-ish system pill; the date divider is
     neutral, like a bubble. Painting both yellow was wrong. */
  .wa-c-date { background: var(--wa-bubble-in, #fff);
    text-transform: uppercase; letter-spacing: .3px; font-weight: 500; }
  .wa-c-notice { background: var(--wa-system-pill, #ffeecc);
    display: inline-flex; align-items: center; gap: 4px; line-height: 1.35;
    text-align: left; }
  .wa-c-notice svg { flex: none; margin-top: 1px; align-self: flex-start; }

  .wa-c-row { display: flex; }
  .wa-c-row.in  { justify-content: flex-start; }
  .wa-c-row.out { justify-content: flex-end; }
  /* Grouped runs sit tighter than the 8px thread gap. */
  .wa-c-row.grouped { margin-top: -6px; }

  .wa-c-bubble { position: relative; max-width: 75%; padding: 6px 8px;
    border-radius: 8px; background: var(--wa-bubble-in, #fff);
    box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .wa-c-row.out .wa-c-bubble { background: var(--wa-bubble-out, #d9fdd3); }
  /* The tail is a notch, which border-radius can't express: square that one
     corner and hang a small triangle off it. The generator will do the same with
     a vector node (BUGFIXES #37/#38 pattern). */
  .wa-c-row.in  .wa-c-bubble.tail { border-top-left-radius: 0; }
  .wa-c-row.out .wa-c-bubble.tail { border-top-right-radius: 0; }
  .wa-c-bubble.tail::before { content: ""; position: absolute; top: 0;
    border-top: 8px solid var(--wa-bubble-in, #fff); width: 0; height: 0; }
  .wa-c-row.in .wa-c-bubble.tail::before { left: -7px; border-left: 7px solid transparent; }
  .wa-c-row.out .wa-c-bubble.tail::before { right: -7px; border-right: 7px solid transparent;
    border-top-color: var(--wa-bubble-out, #d9fdd3); }

  .wa-c-text { font-size: 14.2px; line-height: 19px; color: var(--wa-text);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Own row, not inline with the text — see the trade-off in CHAT_UI.md. */
  .wa-c-meta { display: flex; align-items: center; justify-content: flex-end;
    gap: 3px; margin-top: 1px; }
  .wa-c-time { font-size: 11px; color: var(--wa-text2); }
  .wa-c-ticks { display: inline-flex; color: var(--wa-text2); }
  .wa-c-ticks.read { color: var(--wa-tick, #53bdeb); }
  .wa-c-ticks svg { display: block; }

  /* Interactive patterns (knowledge/CHAT_PATTERNS.md). The payload limits are
     official; this LAYOUT is inferred — no official screenshot of reply buttons,
     the list sheet or template buttons was found, so treat it as a first pass. */
  .wa-c-tpl-header { font-size: 15px; font-weight: 600; color: var(--wa-text);
    line-height: 20px; margin-bottom: 1px; }
  .wa-c-tpl-footer { font-size: 12.5px; color: var(--wa-text2); line-height: 17px;
    margin-top: 2px; }
  /* Full-bleed inside the bubble: negative margins cancel the bubble's 8px
     padding so the dividers reach both edges, as WhatsApp draws them. */
  .wa-c-actions-box { margin: 4px -8px -6px; border-top: 1px solid var(--wa-divider);
    display: flex; flex-direction: column; }
  .wa-c-action { display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 8px 10px; font-size: 14px; font-weight: 500;
    color: var(--wa-link); text-align: center; }
  .wa-c-action + .wa-c-action { border-top: 1px solid var(--wa-divider); }
  .wa-c-action svg { flex: none; }

  /* Media bubbles. Grounded on the official conversation screenshot: the media
     nearly fills the bubble and the meta is overlaid on it, bottom-right, over a
     scrim — not on a row underneath. */
  .wa-c-bubble.media { padding: 3px; }
  .wa-c-media { position: relative; border-radius: 6px; overflow: hidden;
    width: 100%; min-width: 190px; }
  .wa-c-media-img { display: block; width: 100%; height: auto; }
  .wa-c-media-ph { aspect-ratio: 4 / 3; display: flex; align-items: center;
    justify-content: center; background: var(--wa-chip); color: var(--wa-placeholder); }
  .wa-c-play { position: absolute; inset: 0; margin: auto; width: 40px; height: 40px;
    border-radius: 50%; background: rgba(11,20,26,.45); color: #fff;
    display: flex; align-items: center; justify-content: center; }
  .wa-c-dur { position: absolute; top: 6px; left: 6px; font-size: 11px; color: #fff;
    background: rgba(11,20,26,.45); border-radius: 4px; padding: 1px 5px; }
  /* Overlaid meta: white on a scrim, since it sits on arbitrary imagery. */
  .wa-c-meta.over { position: absolute; right: 6px; bottom: 5px; margin: 0;
    background: rgba(11,20,26,.42); border-radius: 8px; padding: 1px 6px; }
  .wa-c-meta.over .wa-c-time { color: #fff; }
  .wa-c-meta.over .wa-c-ticks { color: #fff; }
  .wa-c-meta.over .wa-c-ticks.read { color: #9ce7ff; }
  .wa-c-caption { padding: 4px 5px 1px; }

  /* Voice note: play glyph, waveform, avatar; duration + meta on the row below. */
  .wa-c-audio-wrap { min-width: 200px; }
  .wa-c-audio { display: flex; align-items: center; gap: 8px; }
  .wa-c-audio > svg { flex: none; color: var(--wa-text2); }
  .wa-c-wave { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1.5px; }
  .wa-c-playhead { flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--wa-primary); margin-right: 3px; }
  .wa-c-bar { flex: none; width: 2px; border-radius: 1px; background: var(--wa-placeholder); }
  .wa-c-audio-av { position: relative; flex: none; }
  .wa-c-mic-badge { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px;
    border-radius: 50%; background: var(--wa-primary); color: var(--wa-on-primary);
    display: flex; align-items: center; justify-content: center; }
  .wa-c-audio-foot { display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-top: 2px; }
  .wa-c-audio-foot .wa-c-meta { margin-top: 0; }

  /* Document — inferred, no reference screenshot. */
  .wa-c-doc { display: flex; align-items: center; gap: 8px; min-width: 180px;
    padding: 6px 8px; border-radius: 6px; background: var(--wa-chip); }
  .wa-c-doc > svg { flex: none; color: var(--wa-text2); }
  .wa-c-doc-text { flex: 1; min-width: 0; }
  .wa-c-doc-name { font-size: 13.5px; color: var(--wa-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wa-c-doc-size { font-size: 11px; color: var(--wa-text2); }

  /* The list menu's bottom sheet — the second state a list message has. */
  .wa-c-sheet { background: var(--wa-surface); border-radius: 12px 12px 0 0;
    padding: 10px 0 4px; box-shadow: 0 -2px 12px rgba(11,20,26,.16); }
  .wa-c-sheet-title { font-size: 15px; font-weight: 600; color: var(--wa-text);
    padding: 4px 16px 10px; }
  .wa-c-sheet-section { font-size: 12px; font-weight: 600; color: var(--wa-primary);
    padding: 8px 16px 4px; text-transform: uppercase; letter-spacing: .04em; }
  .wa-c-sheet-row { display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; border-top: 1px solid var(--wa-divider); }
  .wa-c-sheet-text { flex: 1; min-width: 0; }
  .wa-c-sheet-row-title { font-size: 14px; color: var(--wa-text); }
  .wa-c-sheet-desc { font-size: 12.5px; color: var(--wa-text2); }
  .wa-c-radio { flex: none; width: 17px; height: 17px; border-radius: 50%;
    border: 1.5px solid var(--wa-placeholder); }

  .wa-c-quote { border-left: 3px solid var(--wa-primary); border-radius: 4px;
    padding: 3px 6px; margin-bottom: 3px; background: rgba(11,20,26,.06); }
  .wa-c-quote-author { font-size: 12px; font-weight: 600; color: var(--wa-primary); }
  .wa-c-quote-text { font-size: 12px; color: var(--wa-text2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .wa-c-input { display: flex; align-items: center; gap: 6px; padding: 6px 7px;
    background: var(--wa-chat-header, #f0f2f5); flex: none; }
  .wa-c-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
    padding: 7px 9px; border-radius: 18px; background: var(--wa-surface, #fff);
    color: var(--wa-text2); }
  .wa-c-field svg { flex: none; }
  .wa-c-field-ph { flex: 1; min-width: 0; font-size: 13px; color: var(--wa-placeholder); }
  .wa-c-mic { flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--wa-primary); color: var(--wa-on-primary); }
  .wa-status { display: flex; justify-content: space-between; align-items: center;
    padding: 9px 16px 5px; background: var(--wa-status, #f7f8fa); color: var(--wa-text); }
  .wa-status-time { font-weight: 600; font-size: 13px; letter-spacing: .2px; }
  .wa-status-icons { display: flex; align-items: center; gap: 5px; }
  .wa-status-icons svg { display: block; }
  /* Header/progress sit on `surface`, matching the status bar above them and the
     generator (in dark, `surface` != `bg`, so a transparent header showed as a
     dark band between two lighter ones). */
  /* Flow modal = a bottom sheet: drag handle, then back / centered title /
     overflow menu. Mirrors chrome.ts so preview and generated frames match. */
  .wa-header { display: flex; flex-direction: column;
    background: var(--wa-surface, #fff);
    border-bottom: 1px solid var(--wa-divider, #e9edef); }
  .wa-handle { flex: none; width: 36px; height: 4px; border-radius: 2px; margin: 8px auto 4px;
    background: var(--wa-input-border, #d1d7db); }
  .wa-hrow { display: flex; align-items: center; gap: 8px; padding: 6px 12px 14px; }
  .wa-hicon { flex: none; display: flex; color: var(--wa-text, #111); }
  .wa-hicon svg { display: block; }
