<style>
  * { box-sizing: border-box; }
  :root {
    --wa: #008069;
    --radius: 8px;
  }
  body {
    margin: 0;
    font: 12px/1.4 Inter, -apple-system, system-ui, sans-serif;
    color: var(--figma-color-text, #1e1e1e);
    background: var(--figma-color-bg, #fff);
  }
  .app { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--figma-color-border, #e6e6e6);
  }
  header .title { font-weight: 600; font-size: 13px; flex: 1; }
  button {
    font: inherit; border: none; border-radius: 6px; padding: 7px 12px;
    cursor: pointer; background: var(--figma-color-bg-secondary, #f0f0f0);
    color: var(--figma-color-text, #1e1e1e);
  }
  button:hover { filter: brightness(0.97); }
  button.primary { background: var(--wa); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; }
  button.sm { padding: 4px 8px; font-size: 11px; }

  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  .tab { padding: 6px 10px; border-radius: 6px 6px 0 0; cursor: pointer; opacity: 0.6; }
  .tab.active { opacity: 1; background: var(--figma-color-bg-secondary, #f0f0f0); font-weight: 600; }

  .screens { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--figma-color-border, #e6e6e6); }
  .chip { padding: 5px 10px; border-radius: 14px; background: var(--figma-color-bg-secondary, #f0f0f0); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .chip.active { background: var(--wa); color: #fff; }
  .chip .x { opacity: 0.7; }

  .body { flex: 1; overflow: auto; padding: 12px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin: 12px 0 6px; }
  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .palette button { text-align: left; }

  .screen-meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; margin-bottom: 8px; }
  label.f { font-size: 11px; opacity: .7; }
  input[type=text], textarea {
    width: 100%; font: inherit; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--figma-color-border, #d9d9d9);
    background: var(--figma-color-bg, #fff); color: inherit;
  }
  .comp-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .comp {
    border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 8px; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .comp .row { display: flex; align-items: center; gap: 6px; }
  .comp .type { font-weight: 600; flex: 1; }
  .comp .drag { cursor: default; opacity: .5; }

  textarea#json { height: calc(100vh - 220px); min-height: 200px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; resize: none; }
  .json-status { margin-top: 6px; font-size: 11px; }
  .json-status.ok { color: var(--wa); }
  .json-status.err { color: #d33; }
  .hint { font-size: 11px; opacity: .6; margin-top: 4px; }
  .empty { opacity: .5; padding: 20px 0; text-align: center; }

  /* ---- Live WhatsApp preview ---- */
  .pv-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pv-tab { padding: 4px 10px; border-radius: 12px; background: var(--figma-color-bg-secondary, #f0f0f0); font-size: 11px; }
  .pv-tab.active { background: var(--wa-primary); color: #fff; }

  .wa-phone {
    width: 300px; margin: 0 auto; border-radius: 22px; overflow: hidden;
    border: 8px solid #111; background: var(--wa-bg, #fff);
    display: flex; flex-direction: column; height: 560px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18); color: var(--wa-text, #111);
  }
  .wa-status { display: flex; justify-content: space-between; align-items: center;
    padding: 6px 14px; font-size: 10px; background: var(--wa-status, #f7f8fa); color: var(--wa-text); }
  .wa-header { display: flex; align-items: center; gap: 14px; padding: 12px 14px;
    border-bottom: 1px solid var(--wa-divider, #e9edef); }
  .wa-close { font-size: 18px; }
  .wa-title { font-weight: 600; font-size: 15px; }
  .wa-sub { font-size: 11px; color: var(--wa-text2, #667781); }
  .wa-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  .wa-h1 { font-size: 20px; font-weight: 700; line-height: 1.25; }
  .wa-h2 { font-size: 16px; font-weight: 600; }
  .wa-body-text { font-size: 14px; line-height: 1.4; }
  .wa-caption { font-size: 12px; color: var(--wa-text2); }
  .wa-link { font-size: 14px; color: var(--wa-link, #027eb5); font-weight: 500; }
  .wa-img { height: 150px; border-radius: 12px; background: var(--wa-divider); }

  .wa-field { display: flex; flex-direction: column; gap: 4px; }
  .wa-label { font-size: 12px; color: var(--wa-text2); font-weight: 500; }
  .wa-help { font-size: 11px; color: var(--wa-text2); }
  .wa-input { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px;
    border: 1px solid var(--wa-input-border, #d1d7db); border-radius: 8px; background: var(--wa-surface, #fff); }
  .wa-input.tall { min-height: 84px; align-items: flex-start; padding-top: 12px; }
  .wa-ph { flex: 1; color: var(--wa-placeholder, #8696a0); font-size: 14px; }
  .wa-trail { color: var(--wa-text2); }

  .wa-opt { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .wa-opt-title { font-size: 14px; }
  .wa-opt-desc { font-size: 12px; color: var(--wa-text2); }
  .wa-mark { width: 20px; height: 20px; flex: 0 0 20px; border: 1.5px solid var(--wa-input-border); box-sizing: border-box; }
  .wa-mark.radio { border-radius: 50%; }
  .wa-mark.check { border-radius: 4px; }
  .wa-mark.on { border-color: var(--wa-primary); }
  .wa-mark.radio.on { border-width: 6px; }
  .wa-mark.check.on { background: var(--wa-primary);
    background-image: linear-gradient(var(--wa-primary), var(--wa-primary)); }

  .wa-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .wa-chip { padding: 7px 14px; border-radius: 16px; background: var(--wa-chip, #f0f2f5); font-size: 13px; }
  .wa-chip.on { background: var(--wa-chip-sel, #d9fdd3); border: 1px solid var(--wa-chip-sel-border, #008069); }

  .wa-footer { padding: 8px 16px 16px; border-top: 1px solid var(--wa-divider); }
  .wa-btn { width: 100%; border: none; border-radius: 24px; padding: 13px; font-weight: 600;
    font-size: 14px; background: var(--wa-primary, #008069); color: var(--wa-on-primary, #fff); cursor: pointer; }

  .wa-sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0;
    border-bottom: 1px solid var(--wa-divider); }
  .wa-sum-val { color: var(--wa-text2); }
</style>

<div class="app">
  <header>
    <span class="title">WhatsApp Flows Builder</span>
    <button id="copy" class="sm">Copy JSON</button>
    <button id="generate" class="primary">Generate in Figma</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="build">Build</div>
    <div class="tab" data-tab="preview">Preview</div>
    <div class="tab" data-tab="json">Flow JSON</div>
  </div>

  <div class="screens" id="screens"></div>

  <div class="body">
    <div class="panel active" id="panel-build">
      <div class="screen-meta" id="screen-meta"></div>

      <div class="section-label">Add component</div>
      <div class="palette" id="palette"></div>

      <div class="section-label">Components on this screen</div>
      <div class="comp-list" id="comp-list"></div>
    </div>

    <div class="panel" id="panel-preview">
      <div id="preview"></div>
    </div>

    <div class="panel" id="panel-json">
      <textarea id="json" spellcheck="false"></textarea>
      <div class="json-status ok" id="json-status">Valid</div>
      <div class="hint">Edits here sync back to the Build tab when valid.</div>
    </div>
  </div>
</div>

<script>/*__UI_BUNDLE__*/</script>
